# Dockhand Git stack (compose path: compose.yaml)
#
# Host port is hardcoded 9090. Do not use ${MMEX_WEB_PORT}: Dockhand injects a
# leading space and Docker then fails with invalid port specification.

services:
  mmex-web:
    container_name: mmex-web
    build: .
    image: mmex-web:latest
    restart: unless-stopped
    ports:
      - "9090:8080"
    environment:
      MMEX_DATA_DIR: /data
      MMEX_DB_PATH: /data/data.mmb
      MMEX_LOCK_HOLDER: mmex-web
      STATIC_DIR: /app/static
      # Pass Dockhand stack env through. Empty default avoids a hard fail if unset.
      # Strip in Settings: Dockhand has injected a leading space on interpolated values.
      PAPERLESS_URL: ${PAPERLESS_URL:-}
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN:-}
      PAPERLESS_INBOX_TAG: ${PAPERLESS_INBOX_TAG:-Nouveau-Relevé}
      # Leftover PHP WebApp sidecar. Host path is hardcoded (Dockhand ${VAR} space trap).
      WEBAPP_DB_PATH: ${WEBAPP_DB_PATH:-/data/webmmxapp/MMEX_New_Transaction.db}
    volumes:
      # Dockhand: set MMEX_HOST_VOLUME without a leading space (same trap as ports).
      - ${MMEX_HOST_VOLUME:-/data/mmex-web}:/data
      - /data/webmmxapp:/data/webmmxapp
    dns:
      - "192.168.0.25"
    labels:
      - "dockhand.url=http://omv.home:9090"
      - "dockhand.update=false"
      - "homepage.group=Compte"
      - "homepage.name=MMEX Web"
      - "homepage.icon=mdi-wallet"
      - "homepage.href=http://omv.home:9090/"
      - "homepage.description=Livre Money Manager Ex"
      - "homepage.widget.type=ping"
      - "homepage.widget.url=http://omv.home:9090/api/health"
