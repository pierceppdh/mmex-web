[project]
name = "mmex-web"
version = "1.14.0"
description = "Local-network web client for Money Manager Ex (.mmb)"
readme = "README.md"
license = { text = "GPL-2.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2.0",
    "pdfplumber>=0.11",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps/api", "packages/mmex-domain", "packages/mmex-recon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "apps/api", "packages/mmex-domain", "packages/mmex-recon"]
